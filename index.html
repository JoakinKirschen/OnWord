<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnWord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='2' width='22' height='28' rx='4' fill='%234338ca'/%3E%3Cpath d='M10 10h12M10 16h12M10 22h7' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/library.css">
<link rel="stylesheet" href="styles/editor.css">
<link rel="stylesheet" href="styles/document.css">
<link rel="stylesheet" href="styles/overlays.css">
<link rel="stylesheet" href="styles/outline.css">
<link rel="stylesheet" href="styles/find.css">
<link rel="stylesheet" href="styles/images.css">
<link rel="stylesheet" href="styles/history.css">
<link rel="stylesheet" href="styles/print.css">
</head>
<body>

<!-- ───────────── Home: document list ───────────── -->
<div id="home" class="view" hidden>
  <header class="home-bar">
    <a class="brand" href="#/">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="2" width="22" height="28" rx="4" fill="currentColor"/><path d="M10 10h12M10 16h12M10 22h7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>OnWord</span>
    </a>
    <input id="search" class="search" type="search" placeholder="Search documents" aria-label="Search documents">
    <button class="icon-btn" data-act="app.theme" title="Toggle dark mode" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
  </header>
  <main class="home-main">
    <div class="home-head">
      <h1>Your documents</h1>
      <div class="home-actions">
        <button class="btn" data-act="library.import">Import file</button>
        <button class="btn primary" data-act="library.new">+ New document</button>
      </div>
    </div>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden></p>
  </main>
</div>

<!-- ───────────── Editor ───────────── -->
<div id="editorView" class="view" hidden>
  <header class="doc-bar">
    <a class="brand" href="#/" title="All documents" aria-label="All documents">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="2" width="22" height="28" rx="4" fill="currentColor"/><path d="M10 10h12M10 16h12M10 22h7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    </a>
    <div class="doc-head">
      <div class="doc-title-row">
        <input id="title" class="doc-title" type="text" spellcheck="false" aria-label="Document title" maxlength="120">
        <span id="saveState" class="save-state" aria-live="polite"></span>
      </div>
      <nav id="menubar" class="menubar" aria-label="Menu"></nav>
    </div>
  </header>

  <div id="toolbar" class="toolbar" role="toolbar" aria-label="Formatting"></div>

  <div class="workspace">
    <aside id="outline" class="outline" aria-label="Document outline" hidden>
      <h2>Outline</h2>
      <nav id="outlineList"></nav>
    </aside>
    <div id="scroller" class="scroller">
      <div id="paper" class="paper">
        <div id="editor" class="doc-content" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Document body"></div>
      </div>
    </div>
  </div>

  <footer class="status">
    <span id="counts"></span>
    <span class="status-hint">Saved in this browser</span>
  </footer>

  <!-- Find & replace -->
  <div id="findPanel" class="find-panel" hidden>
    <div class="find-row">
      <input id="findInput" type="text" placeholder="Find" aria-label="Find">
      <span id="findCount" class="find-count">0 of 0</span>
      <button class="icon-btn sm" data-act="find.prev" title="Previous" aria-label="Previous match"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
      <button class="icon-btn sm" data-act="find.next" title="Next" aria-label="Next match"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="icon-btn sm" data-act="find.close" title="Close" aria-label="Close find"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="find-row">
      <input id="replaceInput" type="text" placeholder="Replace with" aria-label="Replace with">
      <button class="btn sm" data-act="find.replace">Replace</button>
      <button class="btn sm" data-act="find.replaceAll">All</button>
    </div>
    <label class="find-opt"><input id="findCase" type="checkbox"> Match case</label>
  </div>

  <!-- Dialogs -->
  <dialog id="linkDlg" class="dlg">
    <form method="dialog">
      <h2>Link</h2>
      <label>Text<input id="linkText" type="text"></label>
      <label>Address<input id="linkUrl" type="text" placeholder="https://example.com" required></label>
      <div class="dlg-actions">
        <button id="linkRemove" class="btn danger-text" value="remove" formnovalidate>Remove link</button>
        <span class="spacer"></span>
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="ok">Apply</button>
      </div>
    </form>
  </dialog>
  
  <dialog id="tableDlg" class="dlg">
    <form method="dialog">
      <h2>Insert table</h2>
      <div class="dlg-cols">
        <label>Rows<input id="tblRows" type="number" min="1" max="50" value="3" required></label>
        <label>Columns<input id="tblCols" type="number" min="1" max="12" value="3" required></label>
      </div>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="ok">Insert</button>
      </div>
    </form>
  </dialog>
  <dialog id="pageDlg" class="dlg">
    <form method="dialog">
      <h2>Page setup</h2>
      <div class="dlg-cols">
        <label>Paper size<select id="pageSize"></select></label>
        <label>Orientation<select id="pageOrientation">
          <option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></label>
      </div>
      <label>Margins<select id="pageMargin"></select></label>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="ok">Apply</button>
      </div>
    </form>
  </dialog>

  <dialog id="historyDlg" class="dlg wide">
    <form method="dialog">
      <h2>Version history</h2>
      <ul id="versionList" class="version-list"></ul>
      <div class="dlg-actions">
        <button class="btn" type="button" data-act="history.save">Save version now</button>
        <span class="spacer"></span>
        <button class="btn primary" value="close">Close</button>
      </div>
    </form>
  </dialog>

  <input id="imgInput" type="file" accept="image/*" hidden>

  <!-- Floating image controls -->
  <div id="imgBar" class="img-bar" hidden>
    <button data-img="25">25%</button><button data-img="50">50%</button><button data-img="75">75%</button><button data-img="100">100%</button>
    <button data-img="remove" class="danger">Remove</button>
  </div>
</div>

<!-- Shared popover (menus, colours) -->
<div id="pop" class="pop" hidden></div>
<div id="toast" class="toast" hidden></div>

<input id="importInput" type="file" accept=".txt,.md,.html,.htm,text/plain,text/html" hidden>

<script type="module" src="src/main.js"></script>
</body>
</html>
