name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The runner image ships PHP with SQLite, which the server tests need; fail loudly if that changes.
      - run: php -m | grep -i pdo_sqlite
      - run: for f in api/index.php api/lib/*.php; do php -l "$f"; done
      - run: npm run verify
